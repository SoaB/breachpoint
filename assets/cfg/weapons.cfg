# ==========================================================================================
# BREACH POINT -- weapon tuning data
# ------------------------------------------------------------------------------------------
# Loaded at boot by bp_weapons_load_config(). Every key is optional: anything missing keeps
# the compiled-in default from s_defaults[] in game/bp_weapons.c, so a partial or corrupt
# file degrades gracefully instead of breaking the build.
#
# Grammar (parsed by engine/bp_config.c):
#   weapon <slot-id>       ... section header; <slot-id> must be pistol|shotgun|smg|rail|rocket
#       key = value        ... one tunable per line
#   end                    ... terminates the section
# Lines starting with '#' or ';' and blank lines are ignored. Keys are case insensitive.
#
# Balancing notes:
#   spread_* are degrees of cone half-angle. Hip spread is multiplied by
#   (1 + moveFactor*spread_move + airFactor*spread_air) and by (1 - ads*0.65).
#   pellets>1 samples the cone once per pellet; a single tracer is drawn per trigger pull.
#   penetration counts how many additional bodies a projectile passes through.
#   headshot_mult applies when the trace hits the MDL head box (see bp_hitdetect.c).
#   blast_self is the fraction of blast_damage the shooter takes from their own rocket,
#   while blast_knockback applies in full -- that asymmetry is what makes rocket jumping work.
# ==========================================================================================

