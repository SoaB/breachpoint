# ==========================================================================================
# BREACH POINT -- enemy archetype data
# ------------------------------------------------------------------------------------------
# Loaded at boot by bp_enemies_load_config(). Same contract as weapons.cfg: every key is
# optional, anything missing keeps the compiled-in default from s_defaults[] in
# game/bp_enemies.c, and a missing file only logs a warning.
#
# Grammar:
#   enemy <archetype>      ... <archetype> must be grunt|hound|brute|turret
#       key = value
#   end
#
# Design notes:
#   armor absorbs 55% of incoming damage before health is touched; the rest passes through.
#   pain_chance gates the stagger reaction, and stagger only fires at all when the hit does
#   more than 6% of the target's *current* health -- that keeps SMG fire from permanently
#   stun-locking a brute while still letting a shotgun blast interrupt it.
#   knockback_scale below 1.0 makes heavies feel heavy; brutes are 0.22.
#   has_head_box=false disables the headshot multiplier for that archetype (quadrupeds and
#   turrets have no meaningful head volume).
#   attack_range is measured from body surface, not centre, so melee reach reads correctly.
# ==========================================================================================

